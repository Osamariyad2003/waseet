services:
  postgres:
    image: postgres:16-alpine
    container_name: waseet-postgres
    environment:
      POSTGRES_USER: waseet
      POSTGRES_PASSWORD: waseet
      POSTGRES_DB: waseet
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U waseet -d waseet"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
